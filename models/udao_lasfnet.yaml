# UDAO-LASFNet Configuration (Uncertainty-Driven Deformable Alignment & Differential FATM)
# Based on LASFNet (YOLOv5s v6.0 Dual-Stream RGB-IR Architecture)

# Parameters
nc: 80  # number of classes (overridden by dataset.yaml during training)
depth_multiple: 0.33  # model depth multiple
width_multiple: 0.50  # layer channel multiple
anchors:
  - [10,13, 16,30, 33,23]  # P3/8
  - [30,61, 62,45, 59,119]  # P4/16
  - [116,90, 156,198, 373,326]  # P5/32

# Dual-Stream RGB + IR Backbone with UDAO-ASFF Fusion at P3/8
backbone:
  # [from, number, module, args]
  [
   # Stream 1: RGB Backbone (P1/2 -> P3/8)
   [-1, 1, Conv, [64, 6, 2, 2]],   # 0-P1/2 (RGB)
   [-1, 1, Conv, [128, 3, 2]],     # 1-P2/4 (RGB)
   [-1, 3, C3, [128]],             # 2-P2/4 (160x160)
   [-1, 1, Conv, [256, 3, 2]],     # 3-P3/8 (80x80)
   [-1, 6, C3, [256]],             # 4-P3/8 (RGB feature map)

   # Stream 2: IR Backbone (P1/2 -> P3/8, routed via from=-4)
   [-4, 1, Conv, [64, 6, 2, 2]],   # 5-P1/2 (IR)
   [-1, 1, Conv, [128, 3, 2]],     # 6-P2/4 (IR)
   [-1, 3, C3, [128]],             # 7-P2/4 (160x160)
   [-1, 1, Conv, [256, 3, 2]],     # 8-P3/8 (80x80)
   [-1, 6, C3, [256]],             # 9-P3/8 (IR feature map)

   # Layer 10: UDAO-ASFF Cross-Modal Deformable Alignment & Self-Modulation Fusion
   [[4, 9], 1, UDAO_ASFF, [256]],  # 10-P3/8 (Aligned RGB+IR, 80x80x128)

   # Shared High-Level Backbone (P4/16 -> P5/32)
   [-1, 1, Conv, [512, 3, 2]],     # 11-P4/16 (40x40)
   [-1, 9, C3, [512]],             # 12
   [-1, 1, Conv, [1024, 3, 2]],    # 13-P5/32 (20x20)
   [-1, 3, C3, [1024]],            # 14
   [-1, 1, SPPF, [1024, 5]],       # 15
  ]

# YOLOv5 v6.0 FPN+PAN Neck with D-FATM at Layer 24
head: [
    [-1, 1, Conv, [512, 1, 1]],                  # 16
    [-1, 1, nn.Upsample, [None, 2, "nearest"]],  # 17
    [[-1, 12], 1, Concat, [1]],                  # 18: cat backbone P4
    [-1, 3, C3, [512, False]],                   # 19

    [-1, 1, Conv, [256, 1, 1]],                  # 20
    [-1, 1, nn.Upsample, [None, 2, "nearest"]],  # 21
    [[-1, 10], 1, Concat, [1]],                  # 22: cat fused P3 (UDAO-ASFF)
    [-1, 3, C3, [256, False]],                   # 23 (P3/8-small)

    # Layer 24: Differential Feature Attention Transformation Module (D-FATM)
    [-1, 1, D_FATM, [128]],                      # 24 (P3/8-small boundary-aware refinement)
    [-1, 3, C3, [256, False]],                   # 25 (P3/8-small output -> Detect)

    [-1, 1, Conv, [256, 3, 2]],                  # 26
    [[-1, 20], 1, Concat, [1]],                  # 27: cat head P4
    [-1, 3, C3, [512, False]],                   # 28 (P4/16-medium output -> Detect)

    [-1, 1, Conv, [512, 3, 2]],                  # 29
    [[-1, 16], 1, Concat, [1]],                  # 30: cat head P5
    [-1, 3, C3, [1024, False]],                  # 31 (P5/32-large output -> Detect)

    [[25, 28, 31], 1, Detect, [nc, anchors]],    # 32: Detect(P3, P4, P5)
  ]
